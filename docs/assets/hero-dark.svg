    <rect x="1056" y="314" width="64" height="64" rx="3" fill="#7CA7FF" stroke="#102235" stroke-width="2.5"/>
    <text x="1088" y="359" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#102235">封</text>
    <rect x="816" y="432" width="216" height="82" rx="2" fill="#102235" stroke="#EAF2FA" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="924" y="486" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="34" font-weight="700" fill="#EAF2FA">成果袋</text>
