  <title id="proof-title">v1.2.0 校验凭条：已实测、未完整实测与范围外</title>
  <desc id="proof-desc">浅色竖向凭条，上下为撕边。本次观测环境为 Windows、Python 3.11.9、stored 压缩的合成文件。已实测为绿色实心：CI 六组通过；8 GiB 单文件实写 stored；同次测试峰值 working set 19.42 MiB。未完整实测为空心：整包 16 GiB 上限、GB 级 deflated，均未完整压力实测。范围外为灰色横线：身份与日志真实性不由脚本证明，生产力收益未量化。</desc>
