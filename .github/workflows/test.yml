name: test
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Optional existing tag or commit to test with the current CI harness'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  test:
    env:
      # -B on the parent does not propagate to Python CLI subprocesses.
      # Keep generated bytecode outside the strict install source manifest.
      PYTHONDONTWRITEBYTECODE: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Record tested revision
        run: git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Use canonical test temp directory
        # macOS /var is a symlink; preserve installer ancestor-link rejection.
        run: python -c "import os; from pathlib import Path; p=Path(os.environ['RUNNER_TEMP']).resolve(); f=open(os.environ['GITHUB_ENV'],'a',encoding='utf-8'); f.write('TMPDIR='+str(p)+'\n'); f.close()"
      - name: Large-file checks and unchanged legacy suites
        if: ${{ hashFiles('tests/test_large_delivery.py') != '' }}
        run: python -B tests/test_large_delivery.py --tool package-delivery/scripts/delivery.py --checker package-delivery/scripts/check_handoff.py --base-tests tests/test_delivery.py --release-tests tests/test_release.py --installer scripts/install.py
      - name: Legacy delivery checks
        if: ${{ hashFiles('tests/test_large_delivery.py') == '' }}
        run: python -B tests/test_delivery.py --tool package-delivery/scripts/delivery.py
      - name: Legacy release checks
        if: ${{ hashFiles('tests/test_large_delivery.py') == '' }}
        run: python -B tests/test_release.py --checker package-delivery/scripts/check_handoff.py --installer scripts/install.py
      - name: Media delivery contract and process limits
        if: ${{ hashFiles('tests/test_media.py') != '' }}
        run: python -B tests/test_media.py --tool package-delivery/scripts/media.py
      - run: python -B scripts/install.py --dry-run --dest "${{ runner.temp }}/skill-install/package-delivery"
