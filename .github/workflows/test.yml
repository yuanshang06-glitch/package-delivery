name: test
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Optional existing tag or commit to test with the current CI harness'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      # macOS /var is a symlink; use the runner's canonical temp directory.
      # This keeps real install ancestor-link checks enabled in every test.
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Record tested revision
        run: git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B tests/test_delivery.py --tool package-delivery/scripts/delivery.py
      - run: python -B tests/test_release.py --checker package-delivery/scripts/check_handoff.py --installer scripts/install.py
      - run: python -B scripts/install.py --dry-run --dest "${{ runner.temp }}/skill-install/package-delivery"
